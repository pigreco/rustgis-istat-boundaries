[package]
name = "istat-boundaries"
version = "0.3.1"
edition = "2024"
license = "MIT"
rust-version = "1.90"
publish = false

# A RustGIS plugin is a WebAssembly module: see scripts/package.py
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rustgis-plugin = { git = "https://github.com/opengeos/rustgis-plugins" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
